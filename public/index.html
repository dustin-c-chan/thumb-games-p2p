<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#12111a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Thumb Games</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <!-- Home: one button, no sign up. -->
    <section id="home" class="screen active">
      <div class="brand">
        <div class="logo">👍</div>
        <h1>Thumb Games</h1>
        <p class="tag">Swipe through quick head-to-head mini games. Real players first, bots when it’s quiet.</p>
      </div>
      <button id="play" class="big-btn" disabled>Connecting…</button>
      <p class="you">You are <b id="my-name">…</b></p>
      <ul class="game-list">
        <li>🂡 Blackjack Duel</li>
        <li>🃏 Blind Bluff</li>
        <li>⚡ Snap!</li>
        <li>♞ Mini Chess</li>
        <li>🏀 Hot Shot Hoops</li>
        <li>⛳ Mini Golf</li>
        <li class="wide">✨ Pachinko Pong</li>
      </ul>
      <p class="stats" id="stats"></p>
    </section>

    <!-- The feed: one game card at a time, swipe up for the next. -->
    <section id="game" class="screen">
      <header class="bar">
        <button id="leave" class="ghost-btn small" title="Back to home">✕</button>
        <div class="title" id="game-title"></div>
        <div class="record" id="record" title="Wins–losses this session">0–0</div>
        <div class="vs" id="vs"></div>
      </header>
      <div id="stage">
        <button id="banner" class="banner hidden">🟢 A real player is ready. Swipe up!</button>
        <div id="card">
          <canvas id="canvas"></canvas>
          <div id="overlay" class="overlay hidden"></div>
        </div>
        <button id="handle" class="handle"><span class="chev">︿</span> Swipe up for next game</button>
      </div>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
